version: 2

models:
  - name: stg_customers
    description: "清洗后的客户表"
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 50
            max_value: 200
    columns:
      - name: customer_id
        description: "客户唯一 ID(来自 raw.customers.id)"
        tests:
          - unique
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: 200

  - name: stg_orders
    description: "清洗后的订单表"
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 50
            max_value: 200
    columns:
      - name: order_id
        description: "订单唯一 ID"
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "下单的客户 ID"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: status
        description: "订单状态"
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
          - not_null

  - name: customers
    description: "客户主表,每客户一行,含订单统计"
    columns:
      - name: customer_id
        description: "客户唯一 ID"
        tests:
          - unique
          - not_null
      - name: first_name
        description: "客户名"
      - name: last_name
        description: "客户姓"
      - name: number_of_orders
        description: "该客户的总订单数"
        tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: first_order_date
        description: "首次下单日期"
      - name: most_recent_order_date
        description: "最近一次下单日期"